name: golden-regen

# Regenerates the golden master of `run_pipeline`
# (patrick/tests/golden/, see patrick/tests/test_run_pipeline_golden.py) in
# the pinned numeric environment of `tests.yml`'s slow-suite -- the only one
# where the committed golden is checked. Trigger: push a branch named
# `golden-regen/<anything>` (after a deliberate change of the pipeline's
# numbers, or a bump of .github/constraints-py311.txt). The golden is
# generated on one runner, then must be reproduced bit for bit on 5 others
# (other CPUs: the annotations name each one) before being committed to the
# branch. Review the diff, then merge the branch.

on:
  push:
    branches: ["golden-regen/**"]

# Same pinning as tests.yml's slow-suite: keep both in sync.
env:
  OPENBLAS_CORETYPE: Haswell
  NPY_ENABLE_CPU_FEATURES: X86_V3

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies (pinned)
        run: pip install -c .github/constraints-py311.txt -e "./patrick[dev,web]" pytest-github-actions-annotate-failures==0.4.2
      - name: Numeric environment
        run: python .github/scripts/numeric_env.py
      - name: Generate the golden master
        run: PATRICK_UPDATE_GOLDEN=1 pytest patrick/tests/test_run_pipeline_golden.py -q -m ""
      - uses: actions/upload-artifact@v4
        with:
          name: golden
          path: patrick/tests/golden/*.json
          if-no-files-found: error

  verify:
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies (pinned)
        run: pip install -c .github/constraints-py311.txt -e "./patrick[dev,web]" pytest-github-actions-annotate-failures==0.4.2
      - name: Numeric environment
        run: python .github/scripts/numeric_env.py
      - uses: actions/download-artifact@v4
        with:
          name: golden
          path: patrick/tests/golden
      - name: Reproduce the golden master
        run: pytest patrick/tests/test_run_pipeline_golden.py -q -m ""

  commit:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: golden
          path: patrick/tests/golden
      - name: Commit the golden master to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patrick/tests/golden
          if git diff --cached --quiet; then echo "golden master unchanged"; exit 0; fi
          git commit -m "test(golden): regenerate the run_pipeline golden master in the pinned CI environment" \
                     -m "Generated by golden-regen run ${{ github.run_id }} on ${{ github.sha }}, reproduced on 5 other runners."
          git push origin "HEAD:${{ github.ref_name }}"
