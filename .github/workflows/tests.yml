name: tests

on:
  push:
  pull_request:

jobs:
  fast-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # `pyproject.toml` declares `requires-python = ">=3.10"` -- exercise
        # the full range it advertises (3.10/3.11/3.12), not just 3.11.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e "./patrick[dev,web]"

      - name: Lint (ruff)
        # Bloquant depuis le lot 2 de l'audit (2026-09-22). Dette soldée le
        # 2026-09-25 : `[tool.ruff.lint].ignore` est vide, les exceptions
        # restantes sont des `noqa` motivés ligne par ligne -- toute
        # nouvelle violation fait échouer la CI.
        run: ruff check .
        working-directory: patrick

      # Only the fast suite runs in CI. `pyproject.toml`'s own
      # `[tool.pytest.ini_options]` already documents why: the full suite
      # (~26 files, ~130 tests) takes ~55-60 min because it includes real
      # model training, full pipeline runs, and worker subprocess tests
      # (marked `@pytest.mark.slow`) -- individually measured at anywhere
      # from ~10s to ~70s each. Running that on every push/PR would make CI
      # a bottleneck rather than a fast feedback loop, and several of the
      # slow tests spawn real subprocesses (`patrick.cli worker`) that are
      # a poor fit for a shared CI runner (extra flakiness, no benefit over
      # local verification). `addopts = "-m 'not slow'"` already makes bare
      # `pytest` fast-only locally; `-m "not slow"` here is the explicit,
      # self-documenting equivalent for CI. Run `pytest -m slow` locally
      # before a release-sensitive merge to cover the excluded tests.
      - name: Run fast test suite
        run: pytest patrick/tests/ -q -m "not slow"

  slow-suite:
    # The ~42 tests marked `slow` (CPCV/DM/PBO, real model training, full
    # pipeline runs, worker subprocess tests) are never run by `fast-suite`
    # above. Running them on every push/PR would slow down iteration (see
    # `fast-suite`'s own comment), so this job is gated to pushes on `main`
    # only -- not pull requests.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e "./patrick[dev,web]"

      - name: Run slow test suite
        run: pytest patrick/tests/ -q -m "slow"
