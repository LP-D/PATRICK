[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patrick"
version = "0.1.0"
description = "Cadre ML/DL multi-actifs autonome : walk-forward, features avancées (Heston/EGARCH/Kalman/HMM/VRP/spike), sélection SHAP/RFE/LASSO, samplers, tuning Optuna — méthodologie issue du projet VIX, généralisée à n'importe quel actif."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "catboost",
    "imbalanced-learn",
    "shap",
    "yfinance",
    "pandas_datareader",
    "requests",
    "arch",
    "pykalman",
    "hmmlearn",
    "pydantic>=2",
    "PyYAML",
    "typer",
    "joblib",
    "openpyxl",
    "xlsxwriter",
    "optuna",
    "duckdb",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]
web = ["fastapi", "uvicorn[standard]", "jinja2", "python-multipart"]

[project.scripts]
patrick = "patrick.cli:app"

[tool.setuptools.packages.find]
include = ["patrick*"]
