{# Onglets d'un run : le détail, l'analyse et le comparateur sont trois pages d'un même run ; la barre les relie (ADR 0010). `tab` : 'detail' | 'analysis'. #}
<nav class="run-tabs" aria-label="{{ t('rt_label') }}">
  <a href="/runs/{{ run_tabs_id | urlencode }}/detail"{% if tab == 'detail' %} aria-current="page"{% endif %}>{{ t('rt_detail') }}</a>
  <a href="/runs/{{ run_tabs_id | urlencode }}/analyse"{% if tab == 'analysis' %} aria-current="page"{% endif %}>{{ t('rt_analysis') }}</a>
  <a href="/runs?compare={{ run_tabs_id | urlencode }}">{{ t('rt_compare') }}</a>
</nav>
