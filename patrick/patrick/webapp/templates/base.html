<!doctype html>
<html lang="{{ lang | default('fr') }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0B0D12">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}PATRICK{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/tokens.css">
    <link rel="stylesheet" href="/static/style.css">
    <script id="i18n-data" type="application/json">{{ i18n_js | default({}) | tojson }}</script>
    <script>
        // app.js/market.js/simulate.js lisent window.I18N (fallback vers leur
        // texte en dur si absent) : doit s'executer avant tout script propre
        // a une page (charge plus bas dans le corps de page) -- place dans le
        // head, donc garanti en premier, sinon la traduction JS est
        // silencieusement toujours ignoree (repli permanent), quelle que
        // soit la langue choisie.
        window.I18N = JSON.parse(document.getElementById("i18n-data").textContent || "{}");

        // Les seules boucles de l'interface (balayage de la jauge en phase non
        // mesurable, respiration du point « en cours ») s'arretent quand
        // l'onglet passe en arriere-plan : une animation non essentielle ne
        // doit pas continuer a consommer hors ecran. CSS : `html[data-page-hidden]`.
        (function () {
            function sync() {
                if (document.hidden) document.documentElement.dataset.pageHidden = "";
                else delete document.documentElement.dataset.pageHidden;
            }
            document.addEventListener("visibilitychange", sync);
            sync();
        })();
    </script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-mark">P</span>
            <span class="brand-name">PATRICK</span>
        </a>
        <span class="tagline">{{ t('tagline') if t else 'walk-forward · SHAP · Optuna — sans YAML' }}</span>
        <nav class="topnav">
            <a href="/runs">{{ t('nav_runs') if t else 'Historique' }}</a>
            <a href="/universe">{{ t('nav_universe') if t else 'Univers' }}</a>
            <a href="/simulate">{{ t('nav_simulate') if t else 'Simulateur' }}</a>
        </nav>
        <nav class="lang-switch" aria-label="Langue / Language">
            <a href="/set-lang/fr?next={{ request.url.path }}" class="{{ 'active' if (lang | default('fr')) == 'fr' else '' }}">FR</a>
            <a href="/set-lang/en?next={{ request.url.path }}" class="{{ 'active' if (lang | default('fr')) == 'en' else '' }}">EN</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <div id="glossary-popover" class="glossary-popover hidden" role="tooltip">
        <button type="button" id="glossary-popover-close" class="glossary-popover-close" aria-label="Close">×</button>
        <div id="glossary-popover-title" class="glossary-popover-title"></div>
        <div id="glossary-popover-body" class="glossary-popover-body"></div>
    </div>
    <script id="glossary-data" type="application/json">{{ glossary | default({}) | tojson }}</script>
    <script src="/static/glossary.js"></script>
    <script src="/static/market.js"></script>
</body>
</html>
