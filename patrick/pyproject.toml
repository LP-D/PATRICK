[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patrick"
version = "0.1.0"
description = "Cadre ML/DL multi-actifs autonome : walk-forward, features avancées (Heston/EGARCH/Kalman/HMM/VRP/spike), sélection SHAP/RFE/LASSO, samplers, tuning Optuna — méthodologie issue du projet VIX, généralisée à n'importe quel actif."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    # xgboost >= 3.1 serializes `base_score` as a vector string ("[5E-1]");
    # shap only parses it from 0.50.0 (shap#4187), which requires Python
    # >= 3.11 -- on 3.10 pip stops at shap 0.49.1 and TreeExplainer raises
    # `ValueError: could not convert string to float`. Cap xgboost there only.
    "xgboost<3.1; python_version < '3.11'",
    "xgboost; python_version >= '3.11'",
    "lightgbm",
    "catboost",
    "imbalanced-learn",
    "shap",
    "yfinance",
    "pandas_datareader",
    "requests",
    "arch",
    "pykalman",
    "hmmlearn",
    "pydantic>=2",
    "PyYAML",
    "typer",
    "joblib",
    "openpyxl",
    "xlsxwriter",
    "optuna",
    "duckdb",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]
web = ["fastapi", "httpx", "uvicorn[standard]", "jinja2", "python-multipart"]

[project.scripts]
patrick = "patrick.cli:app"

[tool.setuptools.packages.find]
include = ["patrick*"]

[tool.ruff.lint]
# Dette, à réduire -- ces 34 familles de règles avaient des violations
# préexistantes au moment où `ruff check` est devenu bloquant en CI
# (2026-09-22, lot 2 de l'audit) : 159 occurrences au total, aucune
# corrigée ici (pas de --fix sur ce lot, seul le lot précédent a
# mécaniquement trié les imports/f-strings/espaces via
# `--select I,F401,F541,W`). Ignorées explicitement plutôt que
# silencieusement non détectées, pour que la CI reste verte sans masquer
# ce qui reste à faire -- retirer un code de cette liste au fur et à
# mesure qu'un lot le nettoie, pas tous d'un coup.
# DTZ00x (datetime naïf) : ignoré jusqu'au chantier point-in-time dédié
# (vintages FRED, cf. rapport d'audit R3c) -- ne pas traiter isolément,
# la correction touche à la sémantique temporelle du pipeline.
ignore = [
    "B008", "B023",
    "BLE001",
    "C405", "C408",
    "DTZ003", "DTZ005", "DTZ011",
    "F601", "F821", "F841",
    "FLY002",
    "I001",
    "ISC004",
    "PERF102",
    "PIE804", "PIE810",
    "PLR0124", "PLR1730",
    "PLW1510",
    "PYI041",
    "RUF007", "RUF013", "RUF046", "RUF059", "RUF100",
    "S112",
    "SIM115",
    "TRY401",
    "UP031", "UP034", "UP035", "UP037",
]

[tool.pytest.ini_options]
# Rapport de correction, D1 : la suite complète (26 fichiers, ~130 tests)
# prend ~55-60 min -- impraticable pour itérer. `pytest` sans argument
# n'exécute que les tests rapides (<~10s chacun, mesurés individuellement,
# cf. rapport de correction) et reste sous les 2 minutes. `pytest -m slow`
# exécute le reste (entraînements de modèles/pipelines complets/EGARCH-HMM-
# ARIMA/sous-processus worker réels). Les deux commandes sont documentées
# dans le README.
addopts = "-m 'not slow'"
markers = [
    "slow: tests dépassant ~10s (entraînement de modèles, pipeline complet, sous-processus worker réel) -- exclus par défaut, lancer avec `pytest -m slow`.",
]
