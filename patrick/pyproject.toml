[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patrick"
version = "0.1.0"
description = "Cadre ML/DL multi-actifs autonome : walk-forward, features avancées (Heston/EGARCH/Kalman/HMM/VRP/spike), sélection SHAP/RFE/LASSO, samplers, tuning Optuna — méthodologie issue du projet VIX, généralisée à n'importe quel actif."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    # xgboost >= 3.1 serializes `base_score` as a vector string ("[5E-1]"); shap only parses it from 0.50.0
    # (shap#4187), which requires Python >= 3.11. The old `xgboost<3.1` cap existed only for Python 3.10
    # (end of life: October 2026), now dropped: the floor on shap keeps the pair consistent.
    "xgboost",
    "lightgbm",
    "catboost",
    "imbalanced-learn",
    "shap>=0.51.0",
    "yfinance",
    "pandas_datareader",
    "requests",
    "arch",
    "pykalman",
    "hmmlearn",
    "pydantic>=2.14.1",        # plancher = version épinglée de .github/constraints-py311.txt : un plancher plus haut rend l'installation épinglée de la suite lente impossible (CI rouge, `stable` n'avance plus)
    "PyYAML",
    "typer",
    "joblib",
    "openpyxl",
    "xlsxwriter",
    "optuna",
    "duckdb",
    "scipy",
    "statsmodels",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "hypothesis", "httpx", "ruff"]
web = ["fastapi", "httpx", "uvicorn[standard]", "jinja2", "python-multipart"]
# Pages Deep learning (/dl) et Reinforcement learning (/rl) : PyTorch, Gymnasium et Stable-Baselines3 ne sont importés qu'à l'usage.
deep = ["torch"]
rl = ["torch", "gymnasium", "stable-baselines3"]

[project.scripts]
patrick = "patrick.cli:app"

[tool.setuptools.packages.find]
include = ["patrick*"]

[tool.ruff.lint]
# Dette ruff soldée (2026-09-25) : les 159 violations ignorées lors du
# passage bloquant en CI (lot 2 de l'audit, 2026-09-22) ont été traitées
# famille par famille -- corrigées (F821/F601/B023/F841/SIM115/B008/PLR0124/
# RUF046/RUF059/C408/UP0xx/PIE/...), restreintes aux exceptions attendues
# (BLE001 à l'intérieur du code métier), ou justifiées ligne par ligne par un
# `noqa` motivé (BLE001 aux frontières fournisseurs/threads/jobs, DTZ00x sur
# l'horodatage local voulu des sauvegardes). Plus aucune règle ignorée
# globalement : toute nouvelle violation bloque la CI.
ignore = []
# DTZ (datetimes sans fuseau) est explicite : ruff 0.16 l'activait par défaut, pas ruff 0.17 -- sans cette ligne
# les `noqa: DTZ00x` ci-dessus passaient en local et échouaient en CI (RUF100, règle non activée).
extend-select = ["DTZ"]

[tool.pytest.ini_options]
# Rapport de correction, D1 : la suite complète (26 fichiers, ~130 tests)
# prend ~55-60 min -- impraticable pour itérer. `pytest` sans argument
# n'exécute que les tests rapides (<~10s chacun, mesurés individuellement,
# cf. rapport de correction) et reste sous les 2 minutes. `pytest -m slow`
# exécute le reste (entraînements de modèles/pipelines complets/EGARCH-HMM-
# ARIMA/sous-processus worker réels). Les deux commandes sont documentées
# dans le README.
addopts = "-m 'not slow and not validity'"
# Garde-fou contre un test figé (une slow-suite CI bloquée sans explication, un pytest orphelin sur le poste) : 30 minutes
# par test, le plus long mesuré en faisant ~5 minutes. `thread` : le mode `signal` n'existe pas sous Windows.
timeout = 1800
timeout_method = "thread"
markers = [
    "slow: tests dépassant ~10s (entraînement de modèles, pipeline complet, sous-processus worker réel) -- exclus par défaut, lancer avec `pytest -m slow`.",
    "validity: le pipeline complet sur des marches aléatoires (protocole statistique de bout en bout, ~1 min par monde) -- exclus par défaut et de la CI poussée, lancer avec `pytest -m validity`.",
]

[tool.mutmut]
# Test de mutation des modules statistiques (`.github/workflows/mutation.yml`, Linux : mutmut ne tourne pas sous Windows).
# Une mutation qui survit = un comportement que les tests ne protègent pas. mutmut 3 copie `source_paths` dans `mutants/`
# (le paquet entier, pour que les imports se résolvent) et ne mute que `only_mutate` ; les tests sont limités à ceux de ces modules.
source_paths = ["patrick/"]
only_mutate = [
    "patrick/validation/dsr.py",
    "patrick/validation/fdr.py",
    "patrick/validation/diebold_mariano.py",
    "patrick/validation/pbo.py",
    "patrick/validation/cpcv.py",
    "patrick/validation/purge.py",
    "patrick/validation/embargo.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_dsr.py",
    "tests/test_fdr.py",
    "tests/test_diebold_mariano.py",
    "tests/test_pbo.py",
    "tests/test_cpcv.py",
    "tests/test_purge.py",
    "tests/test_splitters_properties.py",
]
